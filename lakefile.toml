name = "Arklib"
lintDriver = "batteries/runLinter"
defaultTargets = ["ArkLib", "ResearchProximityPrize"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.longFile = 1500

[moreServerOptions]
linter.mathlibStandardSet = true
linter.style.longFile = 1500

[[require]]
name = "VCVio"
git = "https://github.com/Verified-zkEVM/VCVio"
rev = "d7089e46d69e07640fa23b5ae6b1b966f1d4b949"

[[require]]
name = "PolyFun"
git = "https://github.com/Verified-zkEVM/PolyFun"
rev = "3710d71b28404a151b8d1f0ce080ea448778dec0"

[[require]]
name = "«doc-gen4»"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.34.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "lean4.18.0"

[[require]]
name = "CompPoly"
git = "https://github.com/yudduy/CompPoly"
rev = "da1e1b5d048d26eca4583ff930f248c5e2bb5d9e"

[[lean_lib]]
name = "ArkLib"

[[lean_lib]]
name = "ResearchProximityPrize"
roots = ["Research.ProximityPrize"]

# Ordinary-import clients for imported native protocol security theorems.
[[lean_lib]]
name = "ArkLibTest"
roots = []
globs = ["ArkLibTest.+"]
