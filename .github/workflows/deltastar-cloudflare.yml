name: Proximity Prize site

on:
  pull_request:
    branches: [main]
    paths: &site-paths
      - "website/deltastar-paper/**"
      - "mine/**"
      - "Research/ProximityPrize/**"
      - "docs/kb/**"
      - "scripts/probes/**"
      - ".github/workflows/deltastar-cloudflare.yml"
  push:
    branches: [main]
    paths: *site-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proximityprize-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build research site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/deltastar-paper/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate static export
        working-directory: website/deltastar-paper
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: proximityprize-site
          path: website/deltastar-paper/out
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish proximityprize.pages.dev
    needs: build
    if: github.repository == 'SlopDotCash/proximityprize' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: proximityprize-pages
      url: https://proximityprize.pages.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: proximityprize-site
          path: website/deltastar-paper/out
      - name: Check deployment credentials and project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROXIMITYPRIZE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PROXIMITYPRIZE_CLOUDFLARE_ACCOUNT_ID }}
        run: node website/deltastar-paper/scripts/check-cloudflare.mjs
      - name: Deploy validated artifact
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.PROXIMITYPRIZE_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.PROXIMITYPRIZE_CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: pages deploy out --project-name=proximityprize --branch=main --commit-hash=${{ github.sha }}
          workingDirectory: website/deltastar-paper
      - name: Verify production content
        run: node website/deltastar-paper/scripts/verify-live.mjs
