name: Build δ* Paper (Cloudflare deployment optional)

on:
  push:
    branches: [main]
    paths:
      - "website/deltastar-paper/**"
      - ".github/workflows/deltastar-cloudflare.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy from GitHub using configured Cloudflare secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/deltastar-paper/package-lock.json

      - name: Build δ* paper site
        working-directory: website/deltastar-paper
        run: |
          npm ci
          npm run build

      - name: Ensure miner onboarding files are deployed
        working-directory: website/deltastar-paper
        run: |
          node scripts/copy-mine.mjs
          cp public/mission.md public/skill.md public/codex.md out/
          test -s out/mission.md
          test -s out/skill.md
          test -s out/codex.md
          grep -q "mission-version:" out/mission.md
          grep -q "bootstrap-version:" out/skill.md
          grep -q "bootstrap-version:" out/codex.md

      - name: Ensure Cloudflare Pages production branch is main
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        run: |
          curl -fsS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/deltastar-paper" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"main"}' \
            -o /tmp/cloudflare-pages-project.json
          node <<'JS'
          const r = require('/tmp/cloudflare-pages-project.json');
          if (!r.success || r.result?.production_branch !== 'main') {
            console.error(JSON.stringify(r));
            process.exit(1);
          }
          JS

      - name: Upload site build
        uses: actions/upload-artifact@v7
        with:
          name: deltastar-paper-site
          path: website/deltastar-paper/out
          if-no-files-found: error

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=deltastar-paper --commit-dirty=true
          workingDirectory: website/deltastar-paper
