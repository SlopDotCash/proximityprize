name: Six-error support multiplicity
on:
  push:
    branches: [feat/six-error-support-multiplicity]
  pull_request:
    paths:
      - Research/ProximityPrize/Frontier/_SixErrorRankSupportMultiplicity.lean
      - Research/ProximityPrize/All.lean
      - Research/ProximityPrize.lean
      - .github/workflows/six-error-support-multiplicity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check downstream proof-source policy
        run: python3 scripts/forbidden_tokens.py
      - uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: ${{ runner.os }}-lean-deps-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lean-deps-
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: ${{ runner.os }}-arklib-build-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-arklib-build-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
            ${{ runner.os }}-arklib-build-
      - name: Fetch dependency cache
        run: ./scripts/lake-locked.sh exe cache get
      - name: Build the consumer with package options and source-policy plugin
        run: ./scripts/lake-locked.sh build Research.ProximityPrize.Frontier._SixErrorRankSupportMultiplicity
      - name: Check declarations and audit axioms
        run: |
          set -o pipefail
          lake env lean -DautoImplicit=false Research/ProximityPrize/Frontier/_SixErrorRankSupportMultiplicity.lean | tee six-error-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('six-error-axioms.log').read_text()
          assert 'sorryAx' not in text
          matches = re.findall(r"'(ProximityGap\.SixErrorRankSupportMultiplicity\.[^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|(does not depend on any axioms))", text)
          expected = {
              'rank_coordinate_multiplicity',
              'rank_support_mass',
              'full_support_relation_of_rank',
              'full_support_relation_of_active_coordinates',
              'full_support_vector_of_active_submodule',
          }
          assert {name.rsplit('.', 1)[1] for name, _, _ in matches} == expected
          assert len(matches) == 5
          for name, names, no_axioms in matches:
              if not no_axioms:
                  assert set(axis.strip() for axis in names.split(',')) <= {'propext', 'Classical.choice', 'Quot.sound'}
          print('Five rank-to-support and circuit declarations kernel checked')
          PY
