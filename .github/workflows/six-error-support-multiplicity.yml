name: Six-error support multiplicity
on:
  push:
    branches: [feat/six-error-support-multiplicity]
  pull_request:
    paths:
      - Research/ProximityPrize/Frontier/_SixErrorRankSupportMultiplicity.lean
      - Research/ProximityPrize/All.lean
      - Research/ProximityPrize.lean
      - .github/workflows/six-error-support-multiplicity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1.7.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/cache/restore@v4
        with:
          path: .lake
          key: six-error-support-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            incidence-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            incidence-dependencies-${{ runner.os }}-
      - name: Fetch dependency cache
        run: ./scripts/lake-locked.sh exe cache get
      - name: Check declarations and audit axioms
        run: |
          set -o pipefail
          lake env lean Research/ProximityPrize/Frontier/_SixErrorRankSupportMultiplicity.lean | tee six-error-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('six-error-axioms.log').read_text()
          assert 'sorryAx' not in text
          matches = re.findall(r"'(ProximityGap\.SixErrorRankSupportMultiplicity\.[^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|(does not depend on any axioms))", text)
          expected = {
              'rank_coordinate_multiplicity',
              'rank_support_mass',
              'full_support_relation_of_rank',
              'full_support_relation_of_active_coordinates',
              'full_support_vector_of_active_submodule',
          }
          assert {name.rsplit('.', 1)[1] for name, _, _ in matches} == expected
          assert len(matches) == 5
          for name, names, no_axioms in matches:
              if not no_axioms:
                  assert set(axis.strip() for axis in names.split(',')) <= {'propext', 'Classical.choice', 'Quot.sound'}
          print('Five rank-to-support and circuit declarations kernel checked')
          PY
