name: First sponsor UDR floor
on:
  push:
    branches: [feat/first-sponsor-udr-floor]
    paths:
      - Research/ProximityPrize/All.lean
      - Research/ProximityPrize/Frontier/_FirstSponsorUDRFloor.lean
      - .github/workflows/first-sponsor-udr.yml
  workflow_dispatch:
  pull_request:
    paths:
      - Research/ProximityPrize/All.lean
      - Research/ProximityPrize/Frontier/_FirstSponsorUDRFloor.lean
      - .github/workflows/first-sponsor-udr.yml
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check downstream proof-source policy
        run: python3 scripts/forbidden_tokens.py
      - name: Independent literal arithmetic
        run: |
          python3 - <<'PY'
          from fractions import Fraction
          n = 2**30
          k = 2**29
          p = n*(2**128+192)+1
          delta = Fraction(1, 4)
          agreement = (1-delta)*n
          assert agreement.denominator == 1
          assert agreement == 805306368
          assert 2*(n-agreement) < n-k+1
          assert n*2**128 <= p
          print({'n': n, 'k': k, 'delta': str(delta), 'agreement': int(agreement),
                 'distance_slack': int(n-k+1-2*(n-agreement)),
                 'field_budget_slack': p-n*2**128})
          PY
      - uses: leanprover/lean-action@v1.6.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Restore dependency cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .lake/packages
            !.lake/packages/**/*.setup.json
          key: ${{ runner.os }}-lean-deps-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lean-deps-
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .lake/build
            !.lake/build/**/*.setup.json
          key: ${{ runner.os }}-arklib-build-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-arklib-build-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}-
            ${{ runner.os }}-arklib-build-
      - run: ./scripts/lake-locked.sh exe cache get
      - name: Build the consumer with package options and source-policy plugin
        run: ./scripts/lake-locked.sh build Research.ProximityPrize.Frontier._FirstSponsorUDRFloor
      - name: Check canonical consumer and source axioms
        run: |
          set -o pipefail
          lake env lean -DautoImplicit=false Research/ProximityPrize/Frontier/_FirstSponsorUDRFloor.lean | tee udr-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('udr-axioms.log').read_text()
          assert 'sorryAx' not in text
          matches = re.findall(r"'([^']+)'\s+depends on axioms:\s*\[([^\]]*)\]", text)
          expected = {
            'ProximityGap.UDRwire.epsMCA_rs_udr_le_full',
            'ProximityGap.FirstSponsorUDRFloor.canonical_epsMCA_quarter_le',
            'ProximityGap.FirstSponsorUDRFloor.quarter_le_canonical_threshold'}
          assert {name for name, _ in matches} == expected
          for name, axioms in matches:
              assert set(map(str.strip, axioms.split(','))) <= {'propext', 'Classical.choice', 'Quot.sound'}, name
          print('Three canonical/source axiom audits passed')
          PY
