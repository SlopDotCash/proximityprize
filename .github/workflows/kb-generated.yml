name: Refresh KB Generated Files

on:
  push:
    branches: ["main"]
    paths:
      - "ArkLib/**/*.lean"
      - "Research/**/*.lean"
      - "ProximityPrize/**/*.lean"
      - "website/blueprint/src/references.bib"
      - "docs/kb/papers/**"
      - "docs/kb/sources/**"
      - "scripts/kb/**"
      - ".github/workflows/kb-generated.yml"
  # Check generated KB state independently of the Lean build.
  pull_request:
    branches: ["main"]
    paths:
      - "ArkLib/**/*.lean"
      - "Research/**/*.lean"
      - "ProximityPrize/**/*.lean"
      - "website/blueprint/src/references.bib"
      - "docs/kb/_generated/**"
      - "docs/kb/papers/**"
      - "docs/kb/sources/**"
      - "scripts/kb/**"
      - ".github/workflows/kb-generated.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: false

      - name: Regenerate KB files
        run: uv run --no-project --python 3.12 python ./scripts/kb/regenerate.py

      - name: Check generated files
        run: uv run --no-project --python 3.12 python ./scripts/kb/check_generated.py

      - name: Lint generated KB state
        run: uv run --no-project --python 3.12 python ./scripts/kb/lint.py --strict-cited-pages --use-generated-indexes

      - name: Verify generated files are committed
        run: |
          changes="$(git status --porcelain --untracked-files=all -- docs/kb/_generated docs/kb/papers docs/kb/sources)"
          if [ -z "$changes" ]; then
            echo "KB generated files are current."
            exit 0
          fi
          echo "KB generated files are stale. Run uv run --no-project --python 3.12 python ./scripts/kb/regenerate.py and commit the result."
          printf '%s\n' "$changes"
          exit 1
