name: Build and Deploy Website to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run containing the staged build artifacts (latest when empty)
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Select successful CI run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            run_id="$EVENT_RUN_ID"
            sha="$EVENT_HEAD_SHA"
          else
            run_id="$REQUESTED_RUN_ID"
            if [ -z "$run_id" ]; then
              run_id="$(gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch=main -f status=success -f per_page=1 \
                --jq '.workflow_runs[0].id')"
            fi
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            conclusion="$(jq -r .conclusion <<<"$run")"
            branch="$(jq -r .head_branch <<<"$run")"
            if [ "$conclusion" != success ] || [ "$branch" != main ]; then
              echo "CI run $run_id must be a successful main-branch run" >&2
              exit 1
            fi
            sha="$(jq -r .head_sha <<<"$run")"
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout validated source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Reclaim runner disk for documentation artifacts
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          echo "Disk after cleanup:"
          df -h /

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Download validated ArkLib build
        uses: actions/download-artifact@v8
        with:
          name: arklib-build-stage-15
          path: ${{ runner.temp }}/arklib-build
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run-id }}

      - name: Assemble and verify compiled project
        run: |
          mkdir -p .lake/build/lib/lean
          tar -C .lake/build/lib/lean -xzf "$RUNNER_TEMP/arklib-build/arklib-build.tar.gz"
          ./scripts/lake-locked.sh build

      - name: Build project documentation
        run: DISABLE_EQUATIONS=1 ./scripts/lake-locked.sh build ArkLib:docs

      - name: Build blueprint
        uses: xu-cheng/texlive-action@v3
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20231201
          run: |
            apk update
            apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory $GITHUB_WORKSPACE
            python3 -m venv env
            source env/bin/activate
            pip install --upgrade pip requests wheel
            pip install pygraphviz
            pip install leanblueprint
            leanblueprint pdf
            leanblueprint web

      - name: Prepare deployment directory
        run: |
          mkdir _deploy
          cp -r home_page/* _deploy/
          mkdir -p _deploy/docs
          cp -r .lake/build/doc/* _deploy/docs/
          cp blueprint/print/print.pdf _deploy/blueprint.pdf
          mkdir -p _deploy/blueprint
          cp -r blueprint/web/* _deploy/blueprint/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
