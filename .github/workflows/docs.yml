name: Build and Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ArkLib/**/*.lean"
      - "ArkLib.lean"
      - "blueprint/**"
      - "home_page/**"
      - "lakefile.toml"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "scripts/lake-locked.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Reclaim runner disk for Lean artifacts
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          echo "Disk after cleanup:"
          df -h /

      # --- Lean and Blueprint Build ---
      - name: Restore Lean cache
        id: lake-cache
        uses: actions/cache/restore@v6
        with:
          path: ./.lake
          # Unique per-attempt primary key + newest-prefix restore so rerun
          # attempts resume from the latest partial snapshot (see ci.yml).
          key: ${{ runner.os }}-lean-docs-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-lean-docs-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-
            ${{ runner.os }}-lean-docs-${{ hashFiles('lake-manifest.json') }}-
            ${{ runner.os }}-lean-docs-${{ hashFiles('lake-manifest.json') }}
            ${{ runner.os }}-lean-ci-${{ hashFiles('lake-manifest.json') }}-
            ${{ runner.os }}-lean-ci-${{ hashFiles('lake-manifest.json') }}

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: ./scripts/lake-locked.sh exe cache get

      # Bounded build so a hosted-runner OOM/death cannot skip the cache save:
      # a timeout fails the step gracefully, the snapshot is saved, and a
      # rerun resumes from it (see ci.yml).
      - name: Build the project
        run: timeout --signal=INT --kill-after=2m 150m ./scripts/lake-locked.sh build
        env:
          LEAN_NUM_THREADS: "1"

      - name: Save Lean cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ./.lake
          key: ${{ runner.os }}-lean-docs-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build project documentation
        id: docs-build
        run: timeout --signal=INT --kill-after=2m 150m ./scripts/lake-locked.sh build ArkLib:docs
        env:
          DISABLE_EQUATIONS: 1
          LEAN_NUM_THREADS: "1"

      - name: Save Lean cache (with docs facet)
        if: always() && steps.docs-build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: ./.lake
          key: ${{ runner.os }}-lean-docs-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-facet

      - name: Build blueprint
        uses: xu-cheng/texlive-action@v3
        with:
          docker_image: ghcr.io/xu-cheng/texlive-full:20231201
          run: |
            apk update
            apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
            git config --global --add safe.directory $GITHUB_WORKSPACE
            python3 -m venv env
            source env/bin/activate
            pip install --upgrade pip requests wheel
            pip install pygraphviz
            pip install leanblueprint
            leanblueprint pdf
            leanblueprint web

      # --- Combine and Deploy ---
      - name: Prepare deployment directory
        run: |
          mkdir _deploy
          # Copy landing page and assets
          cp -r home_page/* _deploy/
          # Create docs directory and copy Lean docs
          mkdir -p _deploy/docs
          cp -r ./.lake/build/doc/* _deploy/docs/
          # Copy blueprint
          cp blueprint/print/print.pdf _deploy/blueprint.pdf
          # Copy blueprint HTML
          mkdir -p _deploy/blueprint
          cp -r blueprint/web/* _deploy/blueprint/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_deploy

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
