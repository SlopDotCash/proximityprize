name: Multi-line relation rank and shortening
on:
  push:
    branches: [research/multiline-relation-shortening, feat/minimum-support-head-plane]
  pull_request:
    paths:
      - ArkLib/Research/ProximityGap/Frontier/_IncidenceDependencyArithmetic.lean
      - ArkLib/Research/ProximityGap/Frontier/_PencilCycleShortening.lean
      - ArkLib/Research/ProximityGap/Frontier/_MinimumSupportHeadPlane.lean
      - ArkLib/Research/ProximityGap/Frontier/_RichPencilDisjoint.lean
      - ArkLib/Research/ProximityGap/Frontier/_RichPencilCycleBudget.lean
      - ArkLib/Research/ProximityGap/Frontier/_ActiveErrorAffineCollapse.lean
      - docs/research/proximity-gap/multiline-relation-shortening.md
      - ArkLib/Research/ProximityGap.lean
      - scripts/probes/probe_multiline_pair_difference_cap.py
      - scripts/probes/probe_multiline_triple_anchor.py
      - .github/workflows/multiline-rank-kernel.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arithmetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/probes/probe_multiline_pair_difference_cap.py
      - run: python3 scripts/probes/probe_multiline_triple_anchor.py
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1.7.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            .lake
            !.lake/**/*.setup.json
          key: multiline-kernel-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            incidence-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            incidence-dependencies-${{ runner.os }}-
      - name: Fetch dependency cache
        run: ./scripts/lake-locked.sh exe cache get
      - name: Check relation arithmetic declarations and audit axioms
        run: |
          set -o pipefail
          lake env lean ArkLib/Research/ProximityGap/Frontier/_IncidenceDependencyArithmetic.lean | tee multiline-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('multiline-axioms.log').read_text()
          assert 'sorryAx' not in text
          matches = re.findall(r"'(ProximityGap\.IncidenceDependencyArithmetic\.[^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|(does not depend on any axioms))",text)
          expected = {
              'coordinate_count_bound',
              'shortened_subspace_bound',
              'quotient_shortening_bound',
              'received_space_shortening_bound',
              'relation_component_shared_support',
              'relation_core_shared_support',
              'relation_core_shortening',
              'relation_core_dimension',
              'projected_relation_shortening',
              'affine_parameters_mem_code',
              'affine_error_plane_support',
              'affine_head_relation_shortening',
              'affine_support_pair_cover',
              'three_pair_cover_card',
              'three_head_support_budget',
              'dependency_necessary',
              'dependency_from_coordinate_ledger',
              'literal_dependency_excluded',
              'shared_support_incidence_budget',
              'projected_relation_incidence_budget',
              'affine_heads_of_small_error_relation',
              'affine_heads_of_small_error_incidence',
              'active_error_rank_incidence_budget',
              'affine_heads_and_agreement_of_small_error_incidence',
              'le_union_card_of_distinct_code_pencils',
              'three_circuit_incidence',
          }
          assert {name.rsplit('.',1)[1] for name,_,_ in matches} == expected
          assert len(matches) == len(expected)
          for name,names,no_axioms in matches:
              if not no_axioms:
                  assert set(name.strip() for name in names.split(',')) <= {'propext','Classical.choice','Quot.sound'}
          print('Structural and finite-ledger declarations kernel checked')
          PY
      - name: Check active-error collapse and audit axioms
        run: |
          set -o pipefail
          ./scripts/lake-locked.sh build ArkLib.Research.ProximityGap.Frontier._ActiveErrorAffineCollapse
          lake env lean ArkLib/Research/ProximityGap/Frontier/_ActiveErrorAffineCollapse.lean | tee active-error-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('active-error-axioms.log').read_text()
          matches = re.findall(r"'ProximityGap\.ActiveErrorAffineCollapse\.([^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|(does not depend on any axioms))", text)
          expected = {'relation_sum_restrict', 'full_support_relation_on_active',
                      'affine_heads_of_active_errors', 'affine_heads_of_active_error_incidence'}
          assert {name for name, _, _ in matches} == expected
          assert len(matches) == len(expected)
          for name, names, no_axioms in matches:
              if not no_axioms:
                  assert set(axiom.strip() for axiom in names.split(',')) <= {'propext', 'Classical.choice', 'Quot.sound'}, name
          print('Active-error collapse declarations kernel checked')
          PY
      - name: Check pencil cycle shortening and audit axioms
        run: |
          set -o pipefail
          lake env lean ArkLib/Research/ProximityGap/Frontier/_PencilCycleShortening.lean | tee pencil-cycle-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('pencil-cycle-axioms.log').read_text()
          result = re.search(r"'ProximityGap\.PencilCycleShortening\.pencilCycle_jumps_mem' depends on axioms:\s*\[([^\]]*)\]", text)
          assert result is not None
          assert {axiom.strip() for axiom in result[1].split(',')} <= {'propext', 'Classical.choice', 'Quot.sound'}
      - name: Check rich pencil cycle budgets and audit axioms
        run: |
          set -o pipefail
          lake env lean ArkLib/Research/ProximityGap/Frontier/_RichPencilCycleBudget.lean | tee rich-pencil-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('rich-pencil-axioms.log').read_text()
          results = re.findall(r"'ProximityGap\.RichPencilCycleBudget\.([^']+)' depends on axioms:\s*\[([^\]]*)\]", text)
          assert {name for name, _ in results} == {'adjacent_exception_mass_le', 'distance_le_twice_radius_of_cycle', 'distance_le_twice_radius_of_affine_cycle'}
          assert len(results) == 3
          for name, axioms in results:
              assert {axiom.strip() for axiom in axioms.split(',')} <= {'propext', 'Classical.choice', 'Quot.sound'}, name
          PY
      - name: Check rich pencil disjointness and audit axioms
        run: |
          set -o pipefail
          ./scripts/lake-locked.sh build ArkLib.Research.ProximityGap.Frontier._IncidenceAffineLines
          lake env lean ArkLib/Research/ProximityGap/Frontier/_RichPencilDisjoint.lean | tee rich-pencil-disjoint-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('rich-pencil-disjoint-axioms.log').read_text()
          result = re.search(r"'ProximityGap\.RichPencilDisjoint\.distance_le_twice_radius_of_meeting_rich_pencils' depends on axioms:\s*\[([^\]]*)\]", text)
          assert result is not None
          assert {axiom.strip() for axiom in result[1].split(',')} <= {'propext', 'Classical.choice', 'Quot.sound'}
          witness = re.search(r"'ProximityGap\.RichPencilDisjoint\.other_heads_eq_of_collinear_triples' depends on axioms:\s*\[([^\]]*)\]", text)
          assert witness is not None
          assert {axiom.strip() for axiom in witness[1].split(',')} <= {'propext', 'Classical.choice', 'Quot.sound'}
          PY
      - name: Check minimum support and audit axioms
        run: |
          set -o pipefail
          lake env lean ArkLib/Research/ProximityGap/Frontier/_MinimumSupportHeadPlane.lean | tee minimum-support-axioms.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('minimum-support-axioms.log').read_text()
          results = re.findall(r"'ProximityGap\.MinimumSupportHeadPlane\.([^']+)' depends on axioms:\s*\[([^\]]*)\]", text)
          assert {name for name, _ in results} == {'residual_on_minimum_support', 'agreement_on_residual_line'}
          assert len(results) == 2
          for name, axioms in results:
              assert {axiom.strip() for axiom in axioms.split(',')} <= {'propext', 'Classical.choice', 'Quot.sound'}, name
          PY
