name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  policy:
    name: source and axiom policy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reject native_decide / bv_decide / custom axioms
        run: python3 scripts/forbidden_tokens.py

      - name: Check source-only gates
        run: |
          python3 scripts/sorry_census.py --fail-on-holes
          bash scripts/check-imports.sh
          python3 scripts/check-docs-integrity.py
          python3 scripts/kb/check_generated.py
          python3 scripts/kb/lint.py --strict-cited-pages

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Build flagship theorem modules
        run: |
          mapfile -t modules < <(
            awk '!/^#/ && NF >= 2 { print $1 }' scripts/flagship_axioms.txt | sort -u
          )
          ./scripts/lake-locked.sh build "${modules[@]}"

      - name: Audit flagship theorem axioms
        run: python3 scripts/axiom_audit.py

  stage-0:
    uses: ./.github/workflows/lean-build-stage.yml
    with:
      stage: 0
      stage-count: 8

  stage-1:
    needs: stage-0
    uses: ./.github/workflows/lean-build-stage.yml
    with:
      stage: 1
      stage-count: 8

  stage-2:
    needs: stage-1
    uses: ./.github/workflows/lean-build-stage.yml
    with:
      stage: 2
      stage-count: 8

  stage-3:
    needs: stage-2
    uses: ./.github/workflows/lean-build-stage.yml
    with:
      stage: 3
      stage-count: 8

  stage-4:
    needs: stage-3
    uses: ./.github/workflows/lean-build-stage.yml
    with:
      stage: 4
      stage-count: 8

  stage-5:
    needs: stage-4
    uses: ./.github/workflows/lean-build-stage.yml
    with:
      stage: 5
      stage-count: 8

  stage-6:
    needs: stage-5
    uses: ./.github/workflows/lean-build-stage.yml
    with:
      stage: 6
      stage-count: 8

  stage-7:
    needs: stage-6
    uses: ./.github/workflows/lean-build-stage.yml
    with:
      stage: 7
      stage-count: 8
