name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-shard:
    name: build (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Reclaim runner disk for Lean artifacts
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          echo "Disk after cleanup:"
          df -h /

      - name: Restore Lean cache
        uses: actions/cache@v6
        with:
          path: ./.lake
          key: ${{ runner.os }}-lean-shard-${{ matrix.shard }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-shard-${{ matrix.shard }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Build assigned modules
        run: bash scripts/ci-build-shard.sh ${{ matrix.shard }} 8

      # Pages consumes these on main instead of recompiling the whole project
      # in one runner. PR runs do not need to pay the upload cost.
      - name: Package compiled ArkLib modules
        if: github.event_name == 'push'
        run: tar -C .lake/build/lib/lean -czf "$RUNNER_TEMP/arklib-shard-${{ matrix.shard }}.tar.gz" ArkLib

      - name: Upload compiled ArkLib modules
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: arklib-lean-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/arklib-shard-${{ matrix.shard }}.tar.gz
          retention-days: 1

  policy:
    name: source and axiom policy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Reject native_decide / bv_decide / custom axioms
        run: python3 scripts/forbidden_tokens.py

      - name: Check source-only gates
        run: |
          python3 scripts/sorry_census.py --fail-on-holes
          bash scripts/check-imports.sh
          python3 scripts/check-docs-integrity.py
          python3 scripts/kb/check_generated.py
          python3 scripts/kb/lint.py --strict-cited-pages

      - name: Set up Lean environment
        uses: leanprover/lean-action@v1.5.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Fetch dependency cache
        run: lake exe cache get

      - name: Audit flagship theorem axioms
        run: python3 scripts/axiom_audit.py
