name: Build Truth Mining (Cloudflare deployment optional)

on:
  push:
    branches: [main]
    paths:
      - "website/truthmining/**"
      - ".github/workflows/truthmining-cloudflare.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/truthmining/**"
      - ".github/workflows/truthmining-cloudflare.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy from GitHub using configured Cloudflare secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/truthmining/package-lock.json

      - name: Build Truth Mining site
        working-directory: website/truthmining
        run: |
          npm ci
          npm run build

      - name: Upload site build
        uses: actions/upload-artifact@v7
        with:
          name: truthmining-site
          path: website/truthmining/out
          if-no-files-found: error

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=truthmining --branch=main --commit-dirty=true
          workingDirectory: website/truthmining
